   <text style="fill: #16332f; font: 700 23px 'DejaVu Sans'; text-anchor: start" x="47.52" y="28.276406" transform="rotate(-0 47.52 28.276406)">Same yearly energy. Very different peak power.</text>
  </g>
  <g id="text_34">
   <text style="fill: #60716a; font: 11px 'DejaVu Sans'; text-anchor: start" x="47.52" y="50.694281" transform="rotate(-0 47.52 50.694281)">Illustration: 10 million electric cars use 21.6 TWh/year in both charging schedules.</text>
  </g>
  <g id="text_35">
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(47.52 404.952523)">Assumptions: 12,000 km/car/year, 0.18 kWh/km measured at the charger, identical daily mileage, evenly spread charging within each window.</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(47.52 416.408266)">Schedules are illustrations, not forecasts or guaranteed achievable flexibility. Other grid demand is not shown; these are not total-system peaks.</text>
  </g>
 </g>

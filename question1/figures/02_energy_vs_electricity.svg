  </g>
  <g id="text_25">
   <text style="fill: #60716a; font: 11px 'DejaVu Sans'; text-anchor: start" x="47.52" y="57.750281" transform="rotate(-0 47.52 57.750281)">Efficient electric equipment can provide more useful services while using less purchased energy.</text>
  </g>
  <g id="text_26">
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(47.52 463.192781)">Source: IEA WEO 2025, Tables A.2a–c (CC BY-NC-SA 4.0); adapted from rounded EJ values. 1 EJ = 277.8 TWh.</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(47.52 474.648523)">This uses total final consumption, including non-energy uses such as feedstocks. Electricity is final end-use electricity, not total generation.</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(47.52 486.104266)">The cases also differ in efficiency and other policies; the chart does not isolate electrification as the only cause.</text>
  </g>

   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(47.52 486.104266)">Current/stated policies describe conditional outcomes. Net zero is a goal-driven pathway. All series use the same 2024 baseline and gross-generation boundary.</text>

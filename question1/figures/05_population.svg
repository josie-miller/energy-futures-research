  </g>
  <g id="text_17">
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(47.52 428.344781)">Calculation using IEA WEO 2025 population (8.091 → 9.572 billion) and demand (27,290 → 49,657 TWh).</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(47.52 439.800523)">The middle bar holds electricity per person constant. The remaining difference combines income, industry, electrification, efficiency and other changes.</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(47.52 451.256266)">This is an accounting illustration, not a causal estimate of each driver. WEO Annex A: CC BY-NC-SA 4.0.</text>

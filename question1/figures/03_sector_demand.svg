  <g id="text_29">
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(47.52 474.648523)">Source: IEA WEO 2025, Tables A.2a–c (CC BY-NC-SA 4.0); rounded EJ values converted to TWh. Other is the residual.</text>

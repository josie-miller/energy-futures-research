  <g id="text_29">
   <text style="fill: #526870; font: 11px 'DejaVu Sans'; text-anchor: start" x="62.731875" y="37.944" transform="rotate(-0 62.731875 37.944)">Annual electricity generation in 2050. These are proposed build plans, not a solved global optimum.</text>

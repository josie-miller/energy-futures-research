  <g id="text_30">
   <text style="fill: #526870; font: 9px 'DejaVu Sans'" transform="translate(62.731875 418.753969)">Ocean includes offshore wind plus tidal, wave and ocean thermal. Storage is not counted as new generation.</text>
   <text style="fill: #526870; font: 9px 'DejaVu Sans'" transform="translate(62.731875 428.832)">Demand scale: Q1 / IEA WEO 2025. Allocation: our proposal. Annual totals do not establish hourly reliability.</text>

   <text style="fill: #16332f; font: 700 23px 'DejaVu Sans'; text-anchor: start" x="34.56" y="31.516406" transform="rotate(-0 34.56 31.516406)">Three days need 18× the storage of four hours</text>
  </g>
  <g id="text_17">
   <text style="fill: #60716a; font: 11px 'DejaVu Sans'; text-anchor: start" x="34.56" y="52.818281" transform="rotate(-0 34.56 52.818281)">Same 100 MW continuous load. No generation during the stated gap. Other ways to cover the gap may be cheaper.</text>
  </g>
  <g id="text_18">
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(34.56 438.396523)">Our calculation: battery capacity = load × hours ÷ (80% usable fraction × 95% discharge efficiency).</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(34.56 449.852266)">This is stored energy, not a complete storage design. Charging supply, battery power, losses, degradation and replacements must also be priced.</text>
  </g>

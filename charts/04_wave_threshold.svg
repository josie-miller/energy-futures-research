  <g id="text_22">
   <text style="fill: #16332f; font: 700 23px 'DejaVu Sans'; text-anchor: start" x="34.56" y="32.596406" transform="rotate(-0 34.56 32.596406)">Ocean energy needs a cost target, not a promise</text>
  </g>
  <g id="text_23">
   <text style="fill: #60716a; font: 11px 'DejaVu Sans'; text-anchor: start" x="34.56" y="56.238281" transform="rotate(-0 34.56 56.238281)">Our sensitivity model: lower installation cost and more usable output must overcome marine maintenance costs.</text>
  </g>
  <g id="text_24">
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(34.56 461.680781)">Assumptions: 7% real financing rate, 20-year life, annual operating costs = 4% of installed cost, net output after downtime.</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(34.56 473.136523)">The $100/MWh line is our test target, not a quoted market price. All-in cost must include installation, moorings, electrical works and provisions.</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(34.56 484.592266)">No customer backup or storage is included. Early projects may face much higher financing costs; test these assumptions before scaling.</text>
  </g>
 </g>

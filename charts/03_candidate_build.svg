  <g id="text_33">
   <text style="fill: #16332f; font: 700 23px 'DejaVu Sans'; text-anchor: start" x="40.32" y="32.596406" transform="rotate(-0 40.32 32.596406)">A concrete design to test: 80,000 TWh per year</text>
  </g>
  <g id="text_34">
   <text style="fill: #60716a; font: 11px 'DejaVu Sans'; text-anchor: start" x="40.32" y="56.238281" transform="rotate(-0 40.32 56.238281)">Our proposed starting shares—not a forecast or a proven cheapest mix. Wave and fusion are not required for this budget.</text>
  </g>
  <g id="text_35">
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(40.32 461.680781)">Assumed average output: solar 18%, wind 35%, fission 85%, hydro 40%, geothermal 85% of rated power.</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(40.32 473.136523)">Net additions use the 2024 fleet in IEA WEO 2025 and 26 years to 2050. Replacing retired plants increases gross construction.</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(40.32 484.592266)">This balances annual generation only. Storage losses, unused output, hourly reliability, location and costs require a regional model.</text>
  </g>

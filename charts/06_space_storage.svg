  <g id="text_14">
   <text style="fill: #16332f; font: 700 23px 'DejaVu Sans'; text-anchor: start" x="34.56" y="32.596406" transform="rotate(-0 34.56 32.596406)">100 kW. Four very different storage requirements.</text>
  </g>
  <g id="text_15">
   <text style="fill: #60716a; font: 11px 'DejaVu Sans'; text-anchor: start" x="34.56" y="56.238281" transform="rotate(-0 34.56 56.238281)">Battery-only darkness comparison. This is not a complete solar-versus-reactor mass comparison.</text>
  </g>
  <g id="text_16">
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(34.56 461.680781)">Assumptions: 200 Wh/kg battery pack, 80% usable fraction, 95% discharge efficiency, zero solar during each gap.</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(34.56 473.136523)">Excludes arrays, charging hardware, thermal protection, degradation and spares. Lunar poles require site-specific illumination.</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(34.56 484.592266)">Darkness examples: NASA STS-116 press kit, Lunar Surface Technology, Mars facts. The 72-hour Mars case is our selected stress test.</text>
  </g>

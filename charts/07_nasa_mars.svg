  <g id="text_19">
   <text style="fill: #16332f; font: 700 23px 'DejaVu Sans'; text-anchor: start" x="34.56" y="32.596406" transform="rotate(-0 34.56 32.596406)">NASA’s Mars studies support fission for essential power</text>
  </g>
  <g id="text_20">
   <text style="fill: #60716a; font: 11px 'DejaVu Sans'; text-anchor: start" x="34.56" y="56.238281" transform="rotate(-0 34.56 56.238281)">Three historical mission designs—not three prices for the same mission, and not flight-demonstrated reactor systems.</text>
  </g>
  <g id="text_21">
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(34.56 461.680781)">Source: NASA, Mars Surface Power, February 2025, p. 6. Each pair uses the mission assumptions of that study.</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(34.56 473.136523)">NASA selected fission as primary surface power for initial crewed Mars missions (p. 2). Hardware still has to be developed and demonstrated.</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(34.56 484.592266)">Do not scale these masses directly to our separate 100 kW example.</text>
  </g>

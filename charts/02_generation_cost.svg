  <g id="text_29">
   <text style="fill: #16332f; font: 700 23px 'DejaVu Sans'; text-anchor: start" x="34.56" y="32.596406" transform="rotate(-0 34.56 32.596406)">Solar and wind start cheap. Reliability costs more.</text>
  </g>
  <g id="text_30">
   <text style="fill: #60716a; font: 11px 'DejaVu Sans'; text-anchor: start" x="34.56" y="56.238281" transform="rotate(-0 34.56 56.238281)">These ranges price generation. They do not buy the same hours of service.</text>
  </g>
  <g id="text_31">
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(34.56 461.680781)">Source: Lazard LCOE+ v19, July 2026, p. 7. Solar + storage is not a guarantee of continuous supply.</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(34.56 473.136523)">*Geothermal uses older estimates adjusted for inflation. **US nuclear is based on Vogtle 3 &amp; 4; it does not describe all countries or existing reactors.</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(34.56 484.592266)">Common financing basis: 60% debt at 8%, 40% equity at 12%. Network, reliability and emissions differences still need a system comparison.</text>
  </g>

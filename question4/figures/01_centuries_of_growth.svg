  <g id="text_20">
   <text style="fill: #536a74; font: 10.5px 'DejaVu Sans'; text-anchor: start" x="61.898438" y="39.96" transform="rotate(-0 61.898438 39.96)">Electricity-generation experiments from 80,000 TWh in 2050. These are assumptions, not forecasts.</text>
  </g>
  <g id="text_21">
   <text style="fill: #536a74; font: 9px 'DejaVu Sans'" transform="translate(61.898438 446.401969)">Start from the 60,000 TWh case instead and every curve is 25% lower. TW labels show average electric power.</text>
   <text style="fill: #536a74; font: 9px 'DejaVu Sans'" transform="translate(61.898438 456.48)">Rates already summarize efficiency and changing services; constant growth is not a prediction that it persists.</text>
  </g>
 </g>

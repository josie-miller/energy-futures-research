  <g id="text_17">
   <text style="fill: #536a74; font: 9px 'DejaVu Sans'" transform="translate(7.2 446.401969)">Replacement approximation: fleet ÷ lifetime, assuming a spread of equipment ages; actual cohorts can differ greatly.</text>
   <text style="fill: #536a74; font: 9px 'DejaVu Sans'" transform="translate(7.2 456.48)">Assumed lifetimes: solar/offshore 30 years, fission 60 years. This is manufacturing scale, not a timed retirement forecast.</text>

   <text style="fill: #536a74; font: 9px 'DejaVu Sans'" transform="translate(7.895937 446.401969)">Comparison lines are not safety limits or temperature predictions. This excludes greenhouse gases and climate feedbacks.</text>
   <text style="fill: #536a74; font: 9px 'DejaVu Sans'" transform="translate(7.895937 456.48)">Solar/wind redirect existing flows; their full electrical output is not automatically new planetary heat.</text>
  </g>
 </g>

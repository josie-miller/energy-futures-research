  <g id="text_23">
   <text style="fill: #193932; font: 700 23px 'DejaVu Sans'; text-anchor: start" x="38.88" y="44.476406" transform="rotate(-0 38.88 44.476406)">Even 1% of future demand means a large fleet</text>
  </g>
  <g id="text_24">
   <text style="fill: #596d64; font: 12px 'DejaVu Sans'" transform="translate(38.88 79.318125)">1% of our two Q1 planning cases = 600–800 TWh of electricity per year.</text>
   <text style="fill: #596d64; font: 12px 'DejaVu Sans'" transform="translate(38.88 96.40275)">Every range supplies the same annual amount; availability by hour still differs.</text>
  </g>
  <g id="text_25">
   <text style="fill: #596d64; font: 9.5px 'DejaVu Sans'" transform="translate(38.88 483.249344)">Calculation: capacity (GW) = annual electricity (TWh) / [8.76 × average-output fraction].</text>
   <text style="fill: #596d64; font: 9.5px 'DejaVu Sans'" transform="translate(38.88 496.774672)">Fractions are explicit illustrations, not company guarantees. Solar is on an AC plant basis.</text>
   <text style="fill: #596d64; font: 9.5px 'DejaVu Sans'" transform="translate(38.88 510.3)">No siting, transmission loss, retirement, construction-rate, cost or hourly-reliability claim is implied.</text>
  </g>

  <g id="text_19">
   <text style="fill: #596d64; font: 12px 'DejaVu Sans'" transform="translate(38.88 82.126125)">Green: averages for established renewable projects commissioned in 2025.</text>
   <text style="fill: #596d64; font: 12px 'DejaVu Sans'" transform="translate(38.88 99.21075)">Orange: early marine estimates with a smaller and less certain evidence base.</text>
  </g>
  <g id="text_20">
   <text style="fill: #596d64; font: 9.5px 'DejaVu Sans'" transform="translate(38.88 498.045344)">Source: IRENA Renewable Power Generation Costs in 2025 (2026), pp. 13–16 and 153–156.</text>
   <text style="fill: #596d64; font: 9.5px 'DejaVu Sans'" transform="translate(38.88 511.570672)">Generation costs, not prices for identical hourly supply. Offshore wind is wind, not wave/tidal energy.</text>
   <text style="fill: #596d64; font: 9.5px 'DejaVu Sans'" transform="translate(38.88 525.096)">Conditional learning estimates at 2 GW cumulative deployment: tidal ~140 and wave ~120 US$/MWh; not current offers.</text>
  </g>

  </g>
  <g id="text_16">
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(38.88 465.208781)">Illustration using IRENA’s $140/kWh 2025 global four-hour battery cost anchor; other values are our assumptions: 7% real finance, 15 years,</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(38.88 476.664523)">2% annual operating cost, 80% usable energy, 95% discharge efficiency, 88% round-trip efficiency and $40/MWh charging electricity.</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(38.88 488.120266)">This is a cost of stored electricity, not the cost of an entire renewable portfolio. It excludes degradation/augmentation and does not size multi-day storage.</text>
  </g>

  <g id="text_38">
   <text style="fill: #60716a; font: 11px 'DejaVu Sans'; text-anchor: start" x="42.12" y="65.958281" transform="rotate(-0 42.12 65.958281)">Together: 54% in the policy case and 73% in the net-zero case. Fission and hydro remain major sources.</text>
  </g>
  <g id="text_39">
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(42.12 535.192781)">Source: IEA WEO 2025, Tables A.3b/c (CC BY-NC-SA 4.0); adaptation. Conditional scenarios, not technical maxima or our optimized mix.</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(42.12 546.648523)">Chart shows eight sources; full data include fossil generation and other sources. SMRs are inside fission; advanced geothermal is inside geothermal.</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(42.12 558.104266)">The high-electrification case also replaces fossil output: adding enough for demand growth alone is insufficient.</text>
  </g>

   <text style="fill: #60716a; font: 11px 'DejaVu Sans'; text-anchor: start" x="38.88" y="65.958281" transform="rotate(-0 38.88 65.958281)">These prices buy different patterns of output. Storage and networks must be sized for the same service before choosing a mix.</text>

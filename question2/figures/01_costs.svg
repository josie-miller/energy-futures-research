  <g id="text_34">
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(38.88 535.192781)">Source: Lazard LCOE+ v19, July 2026, p. 7. Modeled, unsubsidized new-build ranges; not household electricity prices.</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(38.88 546.648523)">*Geothermal and coal use older estimates adjusted for inflation. **Nuclear reflects Vogtle 3/4, not every country or existing reactors.</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(38.88 558.104266)">Solar + storage is not a continuous-power guarantee. Financing: 60% debt at 8%, 40% equity at 12%.</text>

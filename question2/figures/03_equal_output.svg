  <g id="text_22">
   <text style="fill: #16332f; font: 700 22px 'DejaVu Sans'; text-anchor: start" x="38.88" y="29.316563" transform="rotate(-0 38.88 29.316563)">The same annual energy needs very different fleets</text>
  </g>
  <g id="text_23">
   <text style="fill: #60716a; font: 11px 'DejaVu Sans'; text-anchor: start" x="38.88" y="58.758281" transform="rotate(-0 38.88 58.758281)">Each bar produces 1,000 TWh/year: 1.7% of a 60,000 TWh world, or 1.25% of an 80,000 TWh world.</text>
  </g>
  <g id="text_24">
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(38.88 465.208781)">Our calculation: capacity = 1,000 TWh ÷ (8.76 × average output fraction). Fractions shown are assumptions, not universal technology constants.</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(38.88 476.664523)">Solar capacity is on an AC electrical basis in this illustration. Do not compare directly with a DC module shipment figure.</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(38.88 488.120266)">This does not price storage, transmission or spare capacity, and it does not establish equal hourly reliability.</text>
  </g>

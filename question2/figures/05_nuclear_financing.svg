  </g>
  <g id="text_17">
   <text style="fill: #16332f; font: 700 22px 'DejaVu Sans'; text-anchor: start" x="38.88" y="29.316563" transform="rotate(-0 38.88 29.316563)">Nuclear economics depend on the project and financing</text>
  </g>
  <g id="text_18">
   <text style="fill: #60716a; font: 11px 'DejaVu Sans'; text-anchor: start" x="38.88" y="58.758281" transform="rotate(-0 38.88 58.758281)">An illustrative plant: 60-year life, 85% average output and $30/MWh for fuel, operations and other running costs.</text>
  </g>
  <g id="text_19">
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(38.88 465.208781)">Our sensitivity model, not a quoted project price or a match to Lazard financing. Capital value is measured when the plant enters service.</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(38.88 476.664523)">Construction financing, overruns and other provisions must be included in that completed capital value; they are not free.</text>
   <text style="fill: #60716a; font: 8.5px 'DejaVu Sans'" transform="translate(38.88 488.120266)">At 7% real financing, doubling completed cost from $6,000 to $12,000/kW raises modeled cost from about $87 to $145/MWh.</text>
  </g>
 </g>
